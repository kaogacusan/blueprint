<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#061a4d" />
  <title>Blueprint Workspace</title>
  <link rel="icon" href="/assets/blueprint-mark.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/admin.css" />
  <script type="importmap">
    { "imports": { "three": "/assets/vendor/three.module.js", "three/addons/": "/assets/vendor/addons/" } }
  </script>
</head>
<body>

  <!-- loading -->
  <div class="boot" id="boot"><img src="/assets/blueprint-mark.png" alt="" /><span class="boot__bar"><i></i></span></div>

  <!-- ───────────── SIGN IN ───────────── -->
  <main class="auth" id="auth" hidden>
    <div class="auth__fog" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <a href="/" class="auth__logo" title="Open the public site">
      <img src="/assets/blueprint-mark.png" alt="" class="auth__logo-mark" />
      <img src="/assets/blueprint-wordmark.png" alt="blueprint" class="auth__logo-word" />
    </a>

    <section class="auth__card">
      <div class="auth__art">
        <div class="auth__scene" id="authScene" aria-hidden="true"></div>
        <p class="auth__tag"><b>Your team. <span>One workspace.</span></b><small>Tasks, files, and the playbook. Together.</small></p>
      </div>
      <form class="auth__form" id="authForm" novalidate>
        <img src="/assets/blueprint-mark.png" alt="" class="auth__mark" />
        <h1 class="auth__title" id="authTitle">Welcome back</h1>
        <p class="auth__sub" id="authSub">Sign in to the Blueprint workspace.</p>
        <label class="afld"><span>Email</span><input id="authEmail" type="email" autocomplete="email" required placeholder="you@email.com" /></label>
        <label class="afld"><span>Password</span><input id="authPass" type="password" autocomplete="current-password" required minlength="8" placeholder="Your password" /></label>
        <p class="auth__err" id="authErr" role="alert" hidden></p>
        <button class="auth__btn" type="submit" id="authBtn">Sign in</button>
        <p class="auth__switch">No login yet, or forgot your password? Ask Keira.</p>
      </form>
    </section>
  </main>

  <!-- ───────────── APP ───────────── -->
  <div class="app" id="app" hidden>
    <aside class="side">
      <a href="/" class="side__brand" title="Open the public site">
        <img src="/assets/blueprint-mark.png" alt="" />
        <span><b>Blueprint</b><small>Team workspace</small></span>
      </a>
      <button class="side__search" id="searchBtn">
        <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <span>Search</span><kbd>⌘K</kbd>
      </button>
      <nav class="nav" id="nav" aria-label="Workspace"></nav>
      <div class="side__me">
        <div class="me" id="me"></div>
        <button class="iconbtn iconbtn--dark" id="tourBtn" title="Show me around (tour)"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"/></svg></button>
        <button class="iconbtn iconbtn--dark" id="pwBtn" title="Change password"><svg class="i" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6M15.5 7.5l3 3L22 7l-3-3"/></svg></button>
        <button class="iconbtn iconbtn--dark" id="signOut" title="Sign out"><svg class="i" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg></button>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="topbar">
      <button class="iconbtn" id="menuBtn" aria-label="Menu"><svg class="i" viewBox="0 0 24 24"><path d="M4 12h16M4 6h16M4 18h16"/></svg></button>
      <img src="/assets/blueprint-wordmark.png" alt="blueprint" />
    </div>

    <main class="main" id="main"></main>
  </div>

  <!-- side panel -->
  <div class="drawer" id="drawer" hidden>
    <div class="drawer__bg" data-close-drawer></div>
    <aside class="dr__panel" id="drawerBody" role="dialog" aria-modal="true"></aside>
  </div>

  <!-- quick search -->
  <div class="palette" id="palette" hidden>
    <div class="pal">
      <label class="pal__in"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="palInput" placeholder="Search tasks, orgs, links, scripts, people…" autocomplete="off" /><kbd>esc</kbd></label>
      <ul class="pal__list" id="palList"></ul>
      <p class="pal__foot"><kbd>↑</kbd><kbd>↓</kbd> to move · <kbd>↵</kbd> to open</p>
    </div>
  </div>

  <!-- confirm -->
  <div class="confirm" id="confirm" hidden>
    <div class="confirm__card">
      <p id="confirmText"></p>
      <div class="confirm__act"><button class="btn btn--ghost" id="confirmCancel">Cancel</button><button class="btn btn--danger" id="confirmOk">Delete</button></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/config.js"></script>
  <script type="module" src="/admin/app.js"></script>
</body>
</html>
