<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Blueprint Online — Build your career brand</title>
  <meta name="description" content="Four short sessions that turn what you’ve done in school, orgs and internships into a résumé, a LinkedIn and an intro people remember. Session 1 is free." />
  <meta name="theme-color" content="#f8fafc" />
  <link rel="icon" href="/assets/blueprint-mark.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<body>
  <header class="bar">
    <div class="wrap bar__in">
      <a href="#/" class="brand" aria-label="Blueprint Online home">
        <img src="/assets/blueprint-mark.png" alt="" class="brand__mark" />
        <img src="/assets/blueprint-wordmark.png" alt="blueprint" class="brand__word" />
        <span class="brand__tag">Online</span>

      <nav class="bar__nav" id="barNav" aria-label="Course"></nav>
      <div class="bar__right" id="barRight"></div>

    <div class="boot"><div><span class="spin"></span><p>Loading Blueprint…</p></div></div>

  <nav class="tabbar" id="tabbar" aria-label="Course" hidden></nav>
